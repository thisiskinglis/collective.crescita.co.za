<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRESCITA COLLECTIVE - By Grace We Grow</title>

<!-- OG Image for WhatsApp / IG -->
<meta property="og:title" content="CRESCITA COLLECTIVE">
<meta property="og:description" content="By Grace We Grow. R99 = 100% to Community Fund. Tap to join">
<meta property="og:image" content="https://collective.crescita.co.za/og-image.jpg?v=11">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:url" content="https://collective.crescita.co.za/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://collective.crescita.co.za/og-image.jpg?v=11">

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#fff;color:#000;font-family:Inter,sans-serif}
body{display:flex;align-items:center;justify-content:center}
.wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px;min-height:100vh;max-width:420px;width:100%}
.brand{font-family:Syne,sans-serif;font-weight:800;font-size:20px;letter-spacing:4px;margin-bottom:32px;color:#000}
.btn-join{background:#000;color:#fff;border:1.5px solid #000;padding:16px 36px;border-radius:999px;font-size:11px;letter-spacing:1.8px;font-weight:800;cursor:pointer;display:inline-block;text-align:center;transition:transform 0.15s;min-width:240px}
.btn-join:active{transform:scale(0.96)}
.perks{margin-top:20px;font-size:11px;color:#666;line-height:1.5;max-width:300px;text-align:center;letter-spacing:0.2px}
.help-link{margin-top:20px;font-size:10px;color:#999;text-decoration:none;letter-spacing:0.5px;border-bottom:1px solid #EDEDED;padding-bottom:2px}
.help-link:hover{color:#000;border-color:#000}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">CRESCITA</div>
  <button class="btn-join" id="joinBtn">JOIN CRESCITA COLLECTIVE</button>
  <div class="perks">By joining you get: Private WhatsApp + 15% off + Growth Call + Performance Programme + Member Card.</div>
  <a class="help-link" href="/install-help.html">How to install after joining →</a>
</div>
<script>
const STRIPE_PAYMENT_LINK = "https://buy.stripe.com/8x2cN615R9gPeVFb2i3oA0j";
function getOrCreateMember(){
  let mn = localStorage.getItem('collective_member_number');
  const params = new URLSearchParams(window.location.search);
  const ref = params.get('ref') || params.get('member');
  if(ref) localStorage.setItem('collective_ref', ref);
  if(!mn || mn==='000' || mn==='0'){
    if(localStorage.getItem('collective_member_number')==='859') return '859';
    mn = String(Math.floor(860 + Math.random()*9000));
    localStorage.setItem('collective_member_number', mn);
  }
  return mn;
}
document.getElementById('joinBtn').addEventListener('click', ()=>{
  const currentMn = getOrCreateMember();
  if(localStorage.getItem('collective_payment_intent')){
    window.location.href = '/app/?member=' + currentMn;
    return;
  }
  const stripeUrl = STRIPE_PAYMENT_LINK + (STRIPE_PAYMENT_LINK.includes('?') ? '&' : '?') + 'client_reference_id=' + currentMn;
  localStorage.setItem('collective_payment_intent','1');
  localStorage.setItem('collective_payment_member', currentMn);
  window.location.href = stripeUrl;
});
if(window.matchMedia('(display-mode: standalone)').matches && localStorage.getItem('collective_member_number')){
  window.location.href = '/app/?member=' + localStorage.getItem('collective_member_number');
}
</script>
</body>
</html>
