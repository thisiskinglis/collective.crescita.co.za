<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="white">
<title>CRESCITA COLLECTIVE</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#fff;font-family:Inter,Helvetica,Arial,sans-serif}
.wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;background:#fff}
.logo{width:72%;max-width:360px;height:auto;display:block;margin-bottom:56px}
.install-btn{appearance:none;border:1.5px solid #000;background:#000;color:#fff;font-weight:800;font-size:13px;letter-spacing:2px;padding:18px 42px;border-radius:999px;cursor:pointer}
.install-btn:active{transform:scale(0.96)}
.hint{margin-top:22px;font-size:11px;letter-spacing:1px;color:#999;text-align:center;max-width:260px;line-height:1.5;display:none}
.hint.show{display:block}
</style>
</head>
<body>
<div class="wrap">
  <img src="crescita_black_trans.png" alt="CRESCITA" class="logo">
  <button class="install-btn" id="installBtn">INSTALL APP</button>
  <div class="hint" id="iosHint">On iPhone: tap Share ↑ then Add to Home Screen</div>
  <div class="hint" id="installedHint">Installed. Open from home screen → app will be at /app/</div>
</div>

<script>
let deferredPrompt = null;
const btn = document.getElementById('installBtn');
const iosHint = document.getElementById('iosHint');
const isIos = /iPhone|iPad|iPod/.test(navigator.userAgent);
const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

if (isStandalone) {
  btn.textContent = "OPEN APP";
  btn.onclick = () => location.href = "app/index.html";
  document.getElementById('installedHint').classList.add('show');
} else {
  if (isIos) {
    iosHint.classList.add('show');
    btn.onclick = () => {
      iosHint.textContent = "Tap Share ↑ → Add to Home Screen";
      iosHint.style.color = "#000";
    };
  } else {
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });
    btn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        btn.textContent = "INSTALLING...";
      } else {
        // no install prompt = just go to app
        location.href = "app/index.html";
      }
    });
  }
}
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
