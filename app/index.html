function urlBase64ToUint8Array(base64String){ const padding='='.repeat((4-base64String.length%4)%4); const base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/'); const rawData=atob(base64); const outputArray=new Uint8Array(rawData.length); for(let i=0;i<rawData.length;i++) outputArray[i]=rawData.charCodeAt(i); return outputArray; }

}

    setTimeout(()=>{ const big=document.getElementById('memberBig'); if(big){ const len=String(mn).length; if(len>=4) big.style.fontSize=len===4?'56px':'44px'; if(len>=5) big.style.fontSize='36px'; } const box=document.getElementById('qrBox'); if(box){ box.innerHTML=''; for(let i=0;i<36;i++){ const d=document.createElement('div'); d.style.borderRadius='2px'; d.style.background=Math.random()>0.4?'#000':'#fff'; box.appendChild(d);} } const c=document.getElementById('memberCanvas'); const qr=document.getElementById('qrTemp'); if(c){ const ctx=c.getContext('2d'); ctx.fillStyle='#000'; ctx.fillRect(0,0,1080,1920); ctx.fillStyle='#fff'; ctx.font='800 48px Syne'; ctx.fillText('CRESCITA',80,140); ctx.fillStyle='#fff'; ctx.font='800 110px Syne'; ctx.fillText('BY GRACE',80,360); ctx.fillStyle='#555'; ctx.fillText('WE GROW',80,480); ctx.fillStyle='#fff'; ctx.font='800 90px Syne'; ctx.fillText('MEMBER',80,720); let bf=mn.length>=4?(mn.length===4?'160px':'130px'):'200px'; ctx.font='800 '+bf+' Syne'; ctx.fillText('#'+mn,80,920); const url='https://collective.crescita.co.za?ref='+mn; if(typeof QRCode!=='undefined'&&qr){ QRCode.toCanvas(qr,url,{width:500,margin:1,color:{dark:'#FFFFFF',light:'#000000'}},(err)=>{ if(!err){ try{ ctx.fillStyle='#000'; ctx.fillRect(70,1140,440,440); ctx.drawImage(qr,80,1150,420,420);}catch(e){} } }); } document.getElementById('dlBtn').onclick=()=>{ c.toBlob(b=>{ const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download='CRESCITA-MEMBER-'+mn+'.png'; a.click(); URL.revokeObjectURL(u); }); }; } },100);

    const fallback=[{date:'SEPTEMBER 2025',title:'CHANGE THE ENDING',file:'/app/programmes/september-change.pdf'}];
    const el=document.getElementById('progList');
    if(el) el.innerHTML=fallback.map(p=>`<div style="padding:12px 0;border-bottom:1px solid #F0F0F0;display:flex;justify-content:space-between"><span style="font-size:11px;font-weight:700">${p.date} — ${p.title}</span><a href="${p.file}" download style="font-size:10px;border:1.5px solid #000;background:#000;color:#fff;padding:8px 14px;border-radius:999px;text-decoration:none;font-weight:800">DOWNLOAD</a></div>`).join('');

  }
