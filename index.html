<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#fff;font-family:Inter,Helvetica,Arial,sans-serif;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
.wrap{
  min-height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:40px 24px;
  background:#fff;
}
.logo{
  width:72%;
  max-width:420px;
  height:auto;
  display:block;
  margin-bottom:56px;
}
.install-btn{
  appearance:none;
  border:1.5px solid #000;
  background:#000;
  color:#fff;
  font-weight:800;
  font-size:13px;
  letter-spacing:2px;
  padding:18px 42px;
  border-radius:999px;
  cursor:pointer;
  transition:transform .12s ease, background .12s ease, color .12s ease;
}
.install-btn:active{transform:scale(0.96)}
.install-btn.outline{
  background:#fff;
  color:#000;
}
.hint{
  margin-top:22px;
  font-size:11px;
  letter-spacing:1px;
  color:#999;
  text-align:center;
  max-width:260px;
  line-height:1.5;
  display:none;
}
.hint.show{display:block}
</style>

<script>
// PWA install handling
let deferredPrompt = null;
const btn = document.getElementById('installBtn');
const iosHint = document.getElementById('iosHint');
const installedHint = document.getElementById('installedHint');

const isIos = /iPhone|iPad|iPod/.test(navigator.userAgent);
const isInStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

if (isInStandalone) {
  btn.textContent = "OPEN APP";
  btn.addEventListener('click', () => {
    // In real app this will go to /app/ - for now reload
    window.location.href = "app/index.html";
  });
  installedHint.classList.add('show');
} else {
  if (isIos) {
    iosHint.classList.add('show');
    btn.textContent = "INSTALL APP";
    btn.addEventListener('click', () => {
      iosHint.style.color = "#000";
      iosHint.textContent = "Tap Share ↑ then Add to Home Screen to install";
    });
  } else {
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      btn.classList.remove('outline');
    });
    btn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          btn.textContent = "INSTALLING...";
        }
        deferredPrompt = null;
      } else {
        // fallback - no prompt available, go to app
        window.location.href = "app/index.html";
      }
    });
  }
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
